name: 🚀 GitHub Metrics
on:
  # Auto-run every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Run on every push to main
  push:
    branches: ["main"]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  github-metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ─── MAIN METRICS CARD ────────────────────────────────────────────────
      - name: 📊 Main Profile Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sibiabi123
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          base_hireable: yes
          config_timezone: Asia/Kolkata
          config_display: regular
          filename: metrics.svg
          output_action: commit

      # ─── GITHUB HABITS & ACTIVITY (Commit time heatmap) ────────────────────
      - name: ⏰ Coding Habits & Commit Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sibiabi123
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: bar
          config_timezone: Asia/Kolkata
          filename: metrics.plugin.habits.svg
          output_action: commit

      # ─── LANGUAGES USED ───────────────────────────────────────────────────
      - name: 💬 Most Used Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sibiabi123
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: ""
          plugin_languages_skipped: ""
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 1%
          filename: metrics.plugin.languages.svg
          output_action: commit

      # ─── CONTRIBUTIONS CALENDAR ───────────────────────────────────────────
      - name: 📅 Contributions Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sibiabi123
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.plugin.isocalendar.svg
          output_action: commit

      # ─── GITHUB ACHIEVEMENTS ─────────────────────────────────────────────
      - name: 🏆 Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sibiabi123
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          filename: metrics.plugin.achievements.svg
          output_action: commit

      # ─── STARRED TOPICS ───────────────────────────────────────────────────
      - name: ⭐ Topics & Interests
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sibiabi123
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 30
          plugin_topics_sort: stars
          plugin_topics_mode: mastered
          filename: metrics.plugin.topics.svg
          output_action: commit
