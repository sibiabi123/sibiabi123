name: 🟢 Daily Aerospace Activity & Telemetry Sync

on:
  schedule:
    # Runs everyday at 00:00 UTC (05:30 AM IST)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  daily-sync:
    name: Sync Telemetry & Green Streak
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Daily Activity Log
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ - Daily Aerospace Telemetry & Cloud Health Check OK" >> activity.log
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.log
          git commit -m "chore(telemetry): daily aerospace sync [$(date -u +'%Y-%m-%d')] 🚀" || echo "No changes to commit"
          git push origin main
